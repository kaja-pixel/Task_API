<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillForge Task Management API Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.25);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --code-bg: #050811;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
                  var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 40%, #94a3b8);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-glow);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row > div {
      flex: 1;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      width: 100%;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Response Panel */
    .response-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .badge-200, .badge-201 { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-400, .badge-404 { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .badge-500 { background: rgba(239, 68, 68, 0.3); color: #ef4444; }

    pre {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 10px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      max-height: 480px;
    }

    /* Task Table */
    .task-list {
      margin-top: 16px;
      max-height: 350px;
      overflow: auto;
    }

    .task-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.8rem;
    }

    .task-table th,
    .task-table td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--card-border);
      vertical-align: middle;
    }

    .task-table th {
      color: var(--text-muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .task-table tbody tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .task-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .task-id {
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      overflow-wrap: anywhere;
      min-width: 150px;
    }

    .tag {
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .tag-status { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
    .tag-priority { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

    .action-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      margin-left: 4px;
    }

    .action-btn:hover {
      color: white;
      border-color: var(--primary);
    }

    .action-btn.delete:hover {
      border-color: var(--danger);
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>SkillForge Task Management API</h1>
        <p>Software Engineering Internship – </p>
      </div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <span class="status-badge">
          <span class="status-dot"></span>
          <span id="health-text">API Online</span>
        </span>
        <a href="/postman/Task_Management_API.postman_collection.json" download class="btn btn-secondary" style="font-size: 0.8rem; padding: 6px 12px; text-decoration: none;">
          📥 Download Postman JSON
        </a>
      </div>
    </header>

    <div class="grid">
      <!-- Left Column: Controls & Actions -->
      <div class="card">
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('create')">➕ Create Task</button>
          <button class="tab-btn" onclick="switchTab('list')">📋 Filter & List</button>
          <button class="tab-btn" onclick="switchTab('update')">✏️ Update / Delete</button>
        </div>

        <!-- 1. CREATE TAB -->
        <div id="tab-create">
          <form id="create-form" onsubmit="handleCreateTask(event)">
            <div class="form-group">
              <label>Task Title *</label>
              <input type="text" id="create-title" class="form-control" placeholder="e.g., Complete Day 1 Backend API" required>
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea id="create-description" class="form-control" rows="2" placeholder="Task details..."></textarea>
            </div>
            <div class="row">
              <div class="form-group">
                <label>Status</label>
                <select id="create-status" class="form-control">
                  <option value="PENDING" selected>PENDING</option>
                  <option value="IN_PROGRESS">IN_PROGRESS</option>
                  <option value="COMPLETED">COMPLETED</option>
                </select>
              </div>
              <div class="form-group">
                <label>Priority</label>
                <select id="create-priority" class="form-control">
                  <option value="LOW">LOW</option>
                  <option value="MEDIUM" selected>MEDIUM</option>
                  <option value="HIGH">HIGH</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Due Date</label>
              <input type="datetime-local" id="create-duedate" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">🚀 Send POST /api/tasks</button>
          </form>
        </div>

        <!-- 2. LIST & FILTER TAB -->
        <div id="tab-list" style="display: none;">
          <div class="row" style="margin-bottom: 12px;">
            <div>
              <label style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Status Filter</label>
              <select id="filter-status" class="form-control" onchange="fetchTasks()">
                <option value="">All Statuses</option>
                <option value="PENDING">PENDING</option>
                <option value="IN_PROGRESS">IN_PROGRESS</option>
                <option value="COMPLETED">COMPLETED</option>
              </select>
            </div>
            <div>
              <label style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Priority Filter</label>
              <select id="filter-priority" class="form-control" onchange="fetchTasks()">
                <option value="">All Priorities</option>
                <option value="LOW">LOW</option>
                <option value="MEDIUM">MEDIUM</option>
                <option value="HIGH">HIGH</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <input type="text" id="filter-search" class="form-control" placeholder="Search tasks by keyword..." oninput="debounceSearch()">
          </div>
          <div class="task-list" id="task-list-container">
            <p style="color: var(--text-muted); font-size: 0.85rem; padding: 12px 0;">Click below to load tasks.</p>
          </div>
          <button onclick="fetchTasks()" class="btn btn-secondary" style="width: 100%; margin-top: 10px;">🔄 Refresh Tasks (GET /api/tasks)</button>
        </div>

        <!-- 3. UPDATE & DELETE TAB -->
        <div id="tab-update" style="display: none;">
          <div class="form-group">
            <label for="manage-id">Task UUID *</label>
            <div class="row">
              <div>
                <input type="text" id="manage-id" class="form-control" placeholder="Paste Task UUID here...">
              </div>
              <button type="button" onclick="handleGetTask()" class="btn btn-secondary">🔎 Get Task</button>
            </div>
          </div>
          <div class="row">
            <div class="form-group">
              <label for="manage-status">Status</label>
              <select id="manage-status" class="form-control">
                <option value="PENDING">PENDING</option>
                <option value="IN_PROGRESS">IN_PROGRESS</option>
                <option value="COMPLETED">COMPLETED</option>
              </select>
            </div>
            <div class="form-group">
              <label for="manage-priority">Priority</label>
              <select id="manage-priority" class="form-control">
                <option value="LOW">LOW</option>
                <option value="MEDIUM" selected>MEDIUM</option>
                <option value="HIGH">HIGH</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="manage-title">Title</label>
            <input type="text" id="manage-title" class="form-control" maxlength="255" placeholder="Get a task before editing it">
          </div>
          <div class="form-group">
            <label for="manage-description">Description</label>
            <textarea id="manage-description" class="form-control" rows="2" placeholder="Task details..."></textarea>
          </div>
          <div class="form-group">
            <label for="manage-duedate">Due Date</label>
            <input type="datetime-local" id="manage-duedate" class="form-control">
          </div>
          <div class="row" style="margin-top: 16px;">
            <button type="button" onclick="handleUpdateTask()" class="btn btn-primary" style="flex: 2;">💾 Update (PUT)</button>
            <button type="button" onclick="handleDeleteTask()" class="btn btn-secondary" style="flex: 1; border-color: var(--danger); color: #f87171;">🗑️ Delete</button>
          </div>
        </div>
      </div>

      <!-- Right Column: Live API Response Viewer -->
      <div class="card">
        <div class="response-header">
          <span class="card-title" style="margin-bottom: 0;">📡 Live Response</span>
          <span id="response-status-badge" class="badge badge-200">200 OK</span>
        </div>
        <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">
          Endpoint: <span id="response-endpoint" style="color: #a5b4fc; font-family: monospace;">GET /api/health</span>
        </div>
        <pre><code id="json-viewer">// Responses will appear here in real-time...</code></pre>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = '/api';
    let searchTimeout;

    function switchTab(tab) {
      document.getElementById('tab-create').style.display = tab === 'create' ? 'block' : 'none';
      document.getElementById('tab-list').style.display = tab === 'list' ? 'block' : 'none';
      document.getElementById('tab-update').style.display = tab === 'update' ? 'block' : 'none';

      document.querySelectorAll('.tab-btn').forEach((btn, index) => {
        btn.classList.toggle('active', 
          (tab === 'create' && index === 0) ||
          (tab === 'list' && index === 1) ||
          (tab === 'update' && index === 2)
        );
      });

      if (tab === 'list') {
        fetchTasks();
      }
    }

    function showResponse(status, endpoint, data) {
      const badge = document.getElementById('response-status-badge');
      badge.textContent = typeof status === 'number' && status > 0 ? `${status}` : 'Network error';
      const badgeClass = String(status).startsWith('2') ? '200' : String(status) === '404' ? '404' : String(status).startsWith('5') || status === 0 ? '500' : '400';
      badge.className = `badge badge-${badgeClass}`;
      document.getElementById('response-endpoint').textContent = endpoint;
      document.getElementById('json-viewer').textContent = JSON.stringify(data, null, 2);
    }

    async function requestJson(path, options) {
      const response = await fetch(`${API_BASE_URL}${path}`, options);
      const text = await response.text();
      let data = {};
      if (text) {
        try {
          data = JSON.parse(text);
        } catch {
          data = { message: text };
        }
      }
      return { response, data };
    }

    function showRequestError(endpoint, error) {
      showResponse(0, endpoint, {
        success: false,
        message: error instanceof Error ? error.message : 'Unable to connect to the API server'
      });
    }

    function toLocalDateTimeValue(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      date.setMinutes(date.getMinutes() - date.getTimezoneOffset());
      return date.toISOString().slice(0, 16);
    }

    function populateManageForm(task) {
      document.getElementById('manage-id').value = task.id || '';
      document.getElementById('manage-status').value = task.status || 'PENDING';
      document.getElementById('manage-priority').value = task.priority || 'MEDIUM';
      document.getElementById('manage-title').value = task.title || '';
      document.getElementById('manage-description').value = task.description || '';
      document.getElementById('manage-duedate').value = toLocalDateTimeValue(task.dueDate);
    }

    async function checkHealth() {
      try {
        const { response, data } = await requestJson('/health');
        showResponse(response.status, 'GET /api/health', data);
        document.getElementById('health-text').textContent = response.ok ? 'API Online' : 'API Error';
      } catch (err) {
        document.getElementById('health-text').textContent = 'Server Offline';
        showRequestError('GET /api/health', err);
      }
    }

    async function handleCreateTask(e) {
      e.preventDefault();
      const title = document.getElementById('create-title').value.trim();
      const description = document.getElementById('create-description').value.trim();
      const status = document.getElementById('create-status').value;
      const priority = document.getElementById('create-priority').value;
      const rawDate = document.getElementById('create-duedate').value;
      const dueDate = rawDate ? new Date(rawDate).toISOString() : null;
      const payload = { title, description: description || null, status, priority, dueDate };

      try {
        const { response, data } = await requestJson('/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        showResponse(response.status, 'POST /api/tasks', data);

        if (response.ok && data.success && data.data) {
          populateManageForm(data.data);
          document.getElementById('create-form').reset();
          await fetchTasks(false);
          showResponse(response.status, 'POST /api/tasks', data);
        }
      } catch (err) {
        showRequestError('POST /api/tasks', err);
      }
    }

    async function fetchTasks(showResult = true) {
      const status = document.getElementById('filter-status').value;
      const priority = document.getElementById('filter-priority').value;
      const search = document.getElementById('filter-search').value.trim();

      const params = new URLSearchParams();
      if (status) params.append('status', status);
      if (priority) params.append('priority', priority);
      if (search) params.append('search', search);

      const query = params.toString();
      const path = `/tasks${query ? `?${query}` : ''}`;
      const endpoint = `GET ${API_BASE_URL}${path}`;

      try {
        const { response, data } = await requestJson(path);
        if (showResult) showResponse(response.status, endpoint, data);

        const container = document.getElementById('task-list-container');
        if (response.ok && data.success && Array.isArray(data.data) && data.data.length > 0) {
          container.innerHTML = `
            <table class="task-table">
              <thead>
                <tr>
                  <th>Task ID</th>
                  <th>Task Title</th>
                  <th>Status</th>
                  <th>Priority</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${data.data.map(task => `
                  <tr>
                    <td class="task-id">${escapeHtml(task.id)}</td>
                    <td class="task-title">${escapeHtml(task.title)}</td>
                    <td><span class="tag tag-status">${escapeHtml(task.status)}</span></td>
                    <td><span class="tag tag-priority">${escapeHtml(task.priority)}</span></td>
                    <td><button type="button" class="action-btn" data-task-id="${escapeHtml(task.id)}">Manage</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        } else if (!response.ok || !data.success) {
          container.innerHTML = `<p style="color: var(--danger); font-size: 0.85rem; padding: 12px 0;">${escapeHtml(data.message || 'Could not load tasks.')}</p>`;
        } else {
          container.innerHTML = `<p style="color: var(--text-muted); font-size: 0.85rem; padding: 12px 0;">No tasks found.</p>`;
        }
      } catch (err) {
        showRequestError(endpoint, err);
        document.getElementById('task-list-container').innerHTML =
          `<p style="color: var(--danger); font-size: 0.85rem; padding: 12px 0;">Could not load tasks. Check that the API server is running.</p>`;
      }
    }

    document.getElementById('task-list-container').addEventListener('click', event => {
      const button = event.target.closest('button[data-task-id]');
      if (button) {
        switchTab('update');
        handleGetTask(button.dataset.taskId);
      }
    });

    function debounceSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(fetchTasks, 300);
    }

    async function handleGetTask(taskId = document.getElementById('manage-id').value.trim()) {
      if (!taskId) {
        showResponse(400, 'GET /api/tasks/:id', {
          success: false,
          message: 'Enter a task UUID first'
        });
        return;
      }

      const path = `/tasks/${encodeURIComponent(taskId)}`;
      try {
        const { response, data } = await requestJson(path);
        showResponse(response.status, `GET ${API_BASE_URL}${path}`, data);
        if (response.ok && data.success && data.data) {
          populateManageForm(data.data);
        }
      } catch (err) {
        showRequestError(`GET ${API_BASE_URL}${path}`, err);
      }
    }

    async function handleUpdateTask() {
      const id = document.getElementById('manage-id').value.trim();
      if (!id) {
        showResponse(400, 'PUT /api/tasks/:id', {
          success: false,
          message: 'Enter a task UUID first'
        });
        return;
      }

      const rawDate = document.getElementById('manage-duedate').value;
      const payload = {
        title: document.getElementById('manage-title').value.trim(),
        description: document.getElementById('manage-description').value.trim() || null,
        status: document.getElementById('manage-status').value,
        priority: document.getElementById('manage-priority').value,
        dueDate: rawDate ? new Date(rawDate).toISOString() : null
      };
      const path = `/tasks/${encodeURIComponent(id)}`;
      try {
        const { response, data } = await requestJson(path, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (response.ok && data.success && data.data) {
          populateManageForm(data.data);
          await fetchTasks(false);
        }
        showResponse(response.status, `PUT ${API_BASE_URL}${path}`, data);
      } catch (err) {
        showRequestError(`PUT ${API_BASE_URL}${path}`, err);
      }
    }

    async function handleDeleteTask() {
      const id = document.getElementById('manage-id').value.trim();
      if (!id) {
        showResponse(400, 'DELETE /api/tasks/:id', {
          success: false,
          message: 'Enter a task UUID first'
        });
        return;
      }

      if (!confirm(`Are you sure you want to delete task ${id}?`)) return;

      const path = `/tasks/${encodeURIComponent(id)}`;
      try {
        const { response, data } = await requestJson(path, { method: 'DELETE' });
        if (response.ok) {
          populateManageForm({});
          await fetchTasks(false);
        }
        showResponse(response.status, `DELETE ${API_BASE_URL}${path}`, data);
      } catch (err) {
        showRequestError(`DELETE ${API_BASE_URL}${path}`, err);
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    // Check health on start
    checkHealth();
  </script>
</body>
</html>
